name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ios-foundation:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Test core logic
        run: swift test
      - name: Build iPhone app
        run: >-
          xcodebuild -project NewToTown.xcodeproj -scheme NewToTown
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Test signup and messaging journeys on iPhone simulator
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for group in data["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcodebuild -project NewToTown.xcodeproj -scheme NewToTown \
            -configuration Debug -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath DerivedData -resultBundlePath UITestResults.xcresult CODE_SIGNING_ALLOWED=NO test

      - name: Save iPhone UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-ui-results
          path: UITestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

  profile-policies:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: newtotown_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Test profile constraints and access policies
        env:
          PGPASSWORD: local-test-only
        run: |
          psql -h localhost -U postgres -d newtotown_test -v ON_ERROR_STOP=1 -f supabase/tests/auth_fixture.sql
          for migration in supabase/migrations/*.sql; do
            psql -h localhost -U postgres -d newtotown_test -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -h localhost -U postgres -d newtotown_test -v ON_ERROR_STOP=1 -f supabase/tests/profiles.sql -f supabase/tests/photos.sql -f supabase/tests/photo_review_flag.sql -f supabase/tests/discovery.sql -f supabase/tests/account_agreements.sql -f supabase/tests/messaging.sql

      - name: Test concurrent messaging transactions
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: newtotown_test
          PGPASSWORD: local-test-only
          NEWTOTOWN_TEST_DATABASE: '1'
        run: python3 supabase/tests/messaging_concurrency.py

  account-deletion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Check, format, and test server handlers
        run: |
          deno fmt --check supabase/functions
          deno lint supabase/functions/_shared supabase/functions/messaging
          deno check supabase/functions/delete-account/index.ts supabase/functions/discovery/index.ts supabase/functions/messaging/index.ts
          deno test supabase/functions
